<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Веб-админка{% endblock %} — Метеостанция «Солигорск»</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101317'/><path d='M22 21h-9a5.5 5.5 0 1 1 1.1-10.9A6.5 6.5 0 0 1 22 13.5 3.75 3.75 0 0 1 22 21Z' fill='none' stroke='%237aa7d1' stroke-width='1.8'/><path d='M12 24.5v1M16 24.5v1M20 24.5v1' stroke='%237aa7d1' stroke-width='1.8' stroke-linecap='round'/></svg>">
    <style>
        svg.icon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M8 21.5v.5M12 21.5v.5M16 21.5v.5"/></svg>
            </span>
            <div>
                <div class="brand-name">Солигорск</div>
                <div class="brand-sub">52.04° N · 27.54° E</div>
            </div>
        </div>

        <div>
            <div class="nav-label">Навигация</div>
            <nav class="nav">
                <a href="/admin" class="{{ 'active' if active == 'dashboard' }}" {% if active == 'dashboard' %}aria-current="page"{% endif %}>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    <span>Дашборд</span>
                </a>
                <a href="/admin/data" class="{{ 'active' if active == 'data' }}" {% if active == 'data' %}aria-current="page"{% endif %}>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
                    <span>Данные</span>
                </a>
                <a href="/admin/users" class="{{ 'active' if active == 'users' }}" {% if active == 'users' %}aria-current="page"{% endif %}>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>Пользователи</span>
                </a>
                <a href="/admin/backups" class="{{ 'active' if active == 'backups' }}" {% if active == 'backups' %}aria-current="page"{% endif %}>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                    <span>Бэкапы</span>
                </a>
            </nav>
        </div>

        <div class="side-foot">
            <div class="status-line">
                <span class="dot {{ 'on' if station_online else 'off' }}"></span>
                <b>{{ 'онлайн' if station_online else 'молчит' }}</b>
            </div>
            <div class="kv">
                <span class="kv-k">замер</span>
                <span class="kv-v">{{ station_age }} назад</span>
            </div>
            <div class="kv">
                <span class="kv-k">аптайм</span>
                <span class="kv-v">{{ uptime }}</span>
            </div>
            <div class="kv">
                <span class="kv-k">тест-режим</span>
                <form method="post" action="/admin/testmode" class="inline">
                    <button class="chip {{ 'chip-on' if test_mode else 'chip-off' }}" data-confirm="Переключить тест-режим?">
                        {{ 'ВКЛ' if test_mode else 'ВЫКЛ' }}
                    </button>
                </form>
            </div>
            <form method="post" action="/admin/logout">
                <button class="ghost">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                    Выйти
                </button>
            </form>
        </div>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
<script src="/static/script.js"></script>
</body>
</html>
