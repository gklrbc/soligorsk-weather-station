[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor

; --- OTA-заливка по Wi-Fi (когда станция уже смонтирована) ---
; 1) раскомментируй upload_port и впиши IP станции
; 2) раскомментируй upload_flags с паролем OTA_PASS из secrets.h
; 3) python -m platformio run -t upload   (зальёт по воздуху)
; upload_protocol = espota
; upload_port = 192.168.1.X
; upload_flags =
;     --password=СМЕНИ_МЕНЯ
